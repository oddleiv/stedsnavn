<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Stedsnavn</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111827;background:#f8fafc}body{margin:0;padding:20px;max-width:900px;margin-inline:auto}h1{font-size:32px;margin:12px 0 4px}.small{color:#64748b;font-size:15px}.card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.04)}button{width:100%;font-size:20px;font-weight:700;padding:18px 16px;border:0;border-radius:18px;margin:8px 0}button.primary{background:#0f172a;color:white}button.secondary{background:#e2e8f0;color:#0f172a}.best{background:#ecfdf5;border-color:#bbf7d0}.best h2{margin-top:0}.bestName{font-size:34px;font-weight:800;line-height:1.1}.muted{color:#64748b}.row{display:grid;grid-template-columns:145px 1fr;gap:8px;border-bottom:1px solid #eef2f7;padding:10px 0}.row:last-child{border-bottom:0}.label{color:#64748b}.value{font-weight:500}.warn{background:#fff7ed;border-color:#fed7aa}.err{background:#fef2f2;border-color:#fecaca;white-space:pre-wrap}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e2e8f0;margin:2px;font-size:13px}.resultList .row{grid-template-columns:120px 1fr}.footer{font-size:13px;color:#64748b;margin:25px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap}.spinner{display:inline-block;width:14px;height:14px;border:3px solid #cbd5e1;border-top-color:#0f172a;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <h1>Stedsnavn</h1>
  <div class="small">Versjon 3: filtrerer bort store/rare OSM-områder som tidssoner.</div>

  <div class="card">
    <button class="primary" id="locBtn">Finn hvor jeg er</button>
    <button class="secondary" id="testBtn">Test med Majorstuen/Fagerborg</button>
    <p class="small">Prioritet: Nominatim lokalt område → Kartverket/SSR nærnavn → OSM-flater. OSM-flater filtreres nå hardere.</p>
  </div>

  <div id="status" class="card">Klar.</div>
  <div id="output"></div>

<script>
const OVERPASS_URL = "https://overpass-api.de/api/interpreter";
const NOMINATIM_URL = "https://nominatim.openstreetmap.org/reverse";
const SSR_URL = "https://ws.geonorge.no/stedsnavn/v1/punkt";

const statusEl = document.getElementById('status');
const outputEl = document.getElementById('output');
const locBtn = document.getElementById('locBtn');
const testBtn = document.getElementById('testBtn');

function setStatus(html){ statusEl.innerHTML = html; }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function fetchWithTimeout(url, opts={}, timeoutMs=8000){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), timeoutMs);
  try { return await fetch(url, {...opts, signal: ctrl.signal}); }
  finally { clearTimeout(id); }
}

function classifyOsm(tags){
  if(!tags) return null;
  const name = tags['name:nb'] || tags.name || tags['alt_name'];
  if(!name) return null;
  const n = String(name).toLowerCase();
  // Kast bort kjente store/tekniske områder
  if(n.includes('timezone') || n.includes('standard time') || n.includes('utc') || n.includes('skandinavia') || n.includes('norden') || n.includes('pohjoismaat') || n.includes('europe/')) return null;

  const place = tags.place;
  const boundary = tags.boundary;
  const admin = tags.admin_level ? parseInt(tags.admin_level,10) : null;
  const landuse = tags.landuse;
  const natural = tags.natural;
  const leisure = tags.leisure;

  if(place){
    const pri = {neighbourhood:1, quarter:2, suburb:3, hamlet:4, village:5, locality:6, town:7, city:8};
    return {name, type:`place=${place}`, priority: pri[place] ?? 20};
  }
  if(boundary === 'administrative' && admin !== null){
    // Behold bare relativt lokale adminområder. 2=land, 3=storregion osv. er for grovt.
    if(admin >= 8) return {name, type:`admin ${admin}`, priority: 30 + admin};
    return null;
  }
  if(landuse && ['residential','commercial','industrial','retail','recreation_ground','cemetery','allotments'].includes(landuse)){
    return {name, type:`landuse=${landuse}`, priority: 15};
  }
  if(leisure && ['park','garden','nature_reserve','sports_centre'].includes(leisure)){
    return {name, type:`leisure=${leisure}`, priority: 16};
  }
  if(natural && ['wood','water','heath','bay','fell','peak'].includes(natural)){
    return {name, type:`natural=${natural}`, priority: 17};
  }
  return null;
}

async function getOsmAreas(lat, lon){
  // is_in gir områder som dekker punktet. Vi filtrerer bort region/tidssone osv.
  const q = `[out:json][timeout:7];is_in(${lat},${lon})->.a;area.a["name"];out tags;`;
  const res = await fetchWithTimeout(OVERPASS_URL, {method:'POST', body:q, headers:{'Content-Type':'text/plain'}}, 9000);
  if(!res.ok) throw new Error(`Overpass svarte ${res.status}`);
  const json = await res.json();
  const rows = (json.elements||[]).map(e => classifyOsm(e.tags)).filter(Boolean);
  const seen = new Set();
  return rows.filter(r => { const k=r.name+'|'+r.type; if(seen.has(k)) return false; seen.add(k); return true; })
             .sort((a,b)=>a.priority-b.priority || a.name.localeCompare(b.name,'nb'));
}

function localFromNominatimAddress(addr){
  if(!addr) return [];
  const candidates = [
    ['neighbourhood', addr.neighbourhood],
    ['quarter', addr.quarter],
    ['suburb', addr.suburb],
    ['city_district', addr.city_district],
    ['hamlet', addr.hamlet],
    ['village', addr.village],
    ['locality', addr.locality],
    ['farm', addr.farm],
    ['town', addr.town],
    ['city', addr.city],
    ['municipality', addr.municipality],
    ['county', addr.county]
  ];
  const seen = new Set();
  return candidates.filter(([k,v]) => v && !seen.has(v) && seen.add(v)).map(([k,v],i)=>({name:v,type:k,priority:5+i}));
}

async function getNominatim(lat, lon){
  const url = `${NOMINATIM_URL}?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&addressdetails=1&namedetails=1&extratags=1&zoom=16&accept-language=nb,no,en`;
  const res = await fetchWithTimeout(url, {headers:{'Accept':'application/json'}}, 8000);
  if(!res.ok) throw new Error(`Nominatim svarte ${res.status}`);
  const json = await res.json();
  return {raw: json, locals: localFromNominatimAddress(json.address)};
}

// WGS84 til UTM sone 33N / EPSG:25833, nok nøyaktig for SSR-oppslag.
function latLonToUTM33(lat, lon){
  const a = 6378137.0, f = 1/298.257222101, k0 = 0.9996;
  const e2 = f*(2-f), ep2 = e2/(1-e2);
  const latRad = lat*Math.PI/180, lonRad = lon*Math.PI/180, lon0 = 15*Math.PI/180;
  const N = a/Math.sqrt(1-e2*Math.sin(latRad)**2);
  const T = Math.tan(latRad)**2;
  const C = ep2*Math.cos(latRad)**2;
  const A = Math.cos(latRad)*(lonRad-lon0);
  const M = a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*latRad
    -(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*latRad)
    +(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*latRad)
    -(35*e2**3/3072)*Math.sin(6*latRad));
  const E = k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  const North = k0*(M+N*Math.tan(latRad)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  return {easting: E, northing: North};
}

async function getSSR(lat, lon){
  const utm = latLonToUTM33(lat, lon);
  const url = `${SSR_URL}?nord=${Math.round(utm.northing)}&ost=${Math.round(utm.easting)}&radius=500&koordsys=25833&treffPerSide=20&side=1`;
  const res = await fetchWithTimeout(url, {}, 8000);
  if(!res.ok) throw new Error(`Kartverket svarte ${res.status}`);
  const json = await res.json();
  const arr = json.navn || json.stedsnavn || json || [];
  const list = Array.isArray(arr) ? arr : (arr.navn || []);
  return list.map(x => {
    const name = x.stedsnavn || x.navn || x.skrivemåte || x.name || (x.navneobjektgruppe && x.navneobjektgruppe[0]);
    const type = x.navneobjekttype || x.objekttype || x.type || '';
    const dist = x.meterFraPunkt || x.avstand || x.distance;
    return {name, type, distance: dist};
  }).filter(x=>x.name);
}

function pickBest(nom, ssr, osm){
  // Foretrekk lokale Nominatim-felt. Ikke velg bare kommune hvis SSR/OSM har noe mer lokalt.
  const nomGood = (nom.locals||[]).find(x => ['neighbourhood','quarter','suburb','city_district','hamlet','village','locality','farm'].includes(x.type));
  if(nomGood) return {name: nomGood.name, source:'Nominatim / OSM-adresse', detail: nomGood.type};
  const ssrGood = (ssr||[]).find(x => x.name);
  if(ssrGood) return {name: ssrGood.name, source:'Kartverket/SSR nærnavn', detail: ssrGood.type || ''};
  const osmGood = (osm||[]).find(x => x.priority < 30);
  if(osmGood) return {name: osmGood.name, source:'OpenStreetMap-flate', detail: osmGood.type};
  const nomAny = (nom.locals||[])[0];
  if(nomAny) return {name: nomAny.name, source:'Nominatim', detail: nomAny.type};
  const osmAny = (osm||[])[0];
  if(osmAny) return {name: osmAny.name, source:'OpenStreetMap-flate', detail: osmAny.type};
  return null;
}

function render(pos, nom, ssr, osm, errors){
  const best = pickBest(nom, ssr, osm);
  let html = '';
  if(best){
    html += `<div class="card best"><h2>Beste forslag</h2><div class="bestName">${esc(best.name)}</div><div class="muted">${esc(best.source)} · ${esc(best.detail)}</div></div>`;
  } else {
    html += `<div class="card warn"><b>Fant ikke lokalt navn.</b><br>Prøv større radius eller et annet sted.</div>`;
  }
  html += `<div class="card"><h2>Posisjon</h2><div class="row"><div class="label">Lat/lon</div><div class="value">${pos.lat.toFixed(6)}, ${pos.lon.toFixed(6)}</div></div><div class="row"><div class="label">Nøyaktighet</div><div class="value">${pos.accuracy ? Math.round(pos.accuracy)+' m' : 'testpunkt'}</div></div></div>`;

  html += `<div class="card resultList"><h2>Nominatim</h2>`;
  if(nom.locals?.length){ nom.locals.forEach(r => html += `<div class="row"><div class="label">${esc(r.type)}</div><div>${esc(r.name)}</div></div>`); }
  else html += `<div class="muted">Ingen lokale adressefelt.</div>`;
  html += `</div>`;

  html += `<div class="card resultList"><h2>Kartverket/SSR nærnavn</h2>`;
  if(ssr?.length){ ssr.slice(0,12).forEach(r => html += `<div class="row"><div class="label">${esc(r.type||'navn')}</div><div>${esc(r.name)} ${r.distance?`<span class="muted">· ${esc(r.distance)} m</span>`:''}</div></div>`); }
  else html += `<div class="muted">Ingen SSR-navn returnert, eller API-formatet var uventet.</div>`;
  html += `</div>`;

  html += `<div class="card resultList"><h2>OSM-flater</h2>`;
  if(osm?.length){ osm.slice(0,12).forEach(r => html += `<div class="row"><div class="label">${esc(r.type)}</div><div>${esc(r.name)}</div></div>`); }
  else html += `<div class="muted">Ingen nyttige OSM-flater etter filtrering.</div>`;
  html += `</div>`;

  if(errors.length){ html += `<div class="card err"><b>Feil/advarsler</b>\n${esc(errors.join('\n'))}</div>`; }
  html += `<div class="footer">Tips: Dersom “Beste forslag” er for grovt, er det ofte fordi OSM mangler nabolagspolygon akkurat der. Da er SSR-listen viktigst.</div>`;
  outputEl.innerHTML = html;
}

async function lookup(lat, lon, accuracy){
  outputEl.innerHTML = '';
  const pos = {lat, lon, accuracy};
  const errors = [];
  let nom = {locals:[]}, ssr = [], osm = [];
  try { setStatus(`<span class="spinner"></span> Slår opp Nominatim …`); nom = await getNominatim(lat, lon); } catch(e){ errors.push('Nominatim: '+e.message); }
  try { setStatus(`<span class="spinner"></span> Slår opp Kartverket/SSR …`); ssr = await getSSR(lat, lon); } catch(e){ errors.push('Kartverket/SSR: '+e.message); }
  try { setStatus(`<span class="spinner"></span> Slår opp OSM-flater …`); osm = await getOsmAreas(lat, lon); } catch(e){ errors.push('OSM/Overpass: '+e.message); }
  setStatus('Oppslag ferdig.');
  render(pos, nom, ssr, osm, errors);
}

locBtn.onclick = () => {
  if(!navigator.geolocation){ setStatus('Denne nettleseren støtter ikke GPS/geolocation.'); return; }
  setStatus(`<span class="spinner"></span> Henter GPS-posisjon …`);
  navigator.geolocation.getCurrentPosition(
    p => lookup(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    err => setStatus(`<b>Klarte ikke hente posisjon:</b> ${esc(err.message)}<br><span class="small">Sjekk at Safari/GitHub Pages har posisjonstillatelse.</span>`),
    {enableHighAccuracy:true, timeout:15000, maximumAge:10000}
  );
};

testBtn.onclick = () => lookup(59.926433, 10.722885, null);
</script>
</body>
</html>
