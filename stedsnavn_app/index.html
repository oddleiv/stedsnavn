<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stedsnavn</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111827;background:#f8fafc}
    body{margin:0;padding:24px 16px 48px;max-width:860px;margin-inline:auto;font-size:18px;line-height:1.45}
    h1{font-size:42px;margin:0 0 8px;font-weight:800} h2{font-size:24px;margin:0 0 14px} h3{font-size:20px;margin:18px 0 8px}
    .muted{color:#64748b}.card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 1px 4px #00000010}
    button{width:100%;border:0;border-radius:18px;padding:18px 16px;margin:8px 0;font-size:22px;font-weight:750;background:#0f172a;color:white}
    button.secondary{background:#e2e8f0;color:#111827}.best{background:#f0fdf4;border-color:#bbf7d0}.warn{background:#fff7ed;border-color:#fed7aa;color:#991b1b}
    .big{font-size:38px;font-weight:850;letter-spacing:.2px}.row{display:grid;grid-template-columns:34% 1fr;gap:12px;border-top:1px solid #edf2f7;padding:10px 0}.row:first-child{border-top:0}
    .label{color:#64748b}.small{font-size:15px}.pill{display:inline-block;background:#e2e8f0;border-radius:999px;padding:5px 10px;margin:3px 4px 3px 0;font-size:14px}
    label.chk{display:flex;gap:10px;align-items:center;margin-top:12px;color:#475569} input[type=checkbox]{width:22px;height:22px}.hidden{display:none} code{background:#e2e8f0;padding:2px 5px;border-radius:5px}
  </style>
</head>
<body>
  <h1>Stedsnavn</h1>
  <p class="muted">Versjon 7: SSR-radius kan velges. Viser både stedsnavn, adresser og samlet antall SSR-treff.</p>
  <div class="card">
    <button id="locBtn">Finn hvor jeg er</button>
    <button id="testBtn" class="secondary">Test med Majorstuen/Fagerborg</button>
    <label class="chk"><input id="overpassChk" type="checkbox"> Søk også OSM-flater/Overpass, tregt</label>
    <label class="chk">SSR-radius <select id="ssrRadius" style="font-size:18px;padding:6px;border-radius:8px;border:1px solid #cbd5e1"><option value="300">300 m</option><option value="500" selected>500 m</option><option value="1000">1 km</option><option value="2000">2 km</option></select></label>
    <p class="muted">Prioritet: Nominatim lokalt område → Kartverket/SSR stedsnavn → adresse/gate. Overpass er av som standard.</p>
  </div>
  <div id="status" class="card">Klar.</div>
  <div id="result"></div>
<script>
const el = id => document.getElementById(id);
const statusBox = el('status'), result = el('result');
const badNames = [/timezone/i,/utc/i,/norden/i,/skandinavia/i,/europe/i,/oslo og akershus/i,/oslo og viken/i,/pohjoismaat/i,/norðurlönd/i];
const addressTypes = ['Adressenavn','Adresse','Vegadresse','Matrikkeladresse'];
function setStatus(s){statusBox.textContent=s;}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function timeoutFetch(url, ms=7000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);return fetch(url,{signal:ac.signal,headers:{'Accept':'application/json'}}).finally(()=>clearTimeout(t));}
function card(title, html, cls=''){return `<div class="card ${cls}"><h2>${esc(title)}</h2>${html}</div>`}
function rows(items){ if(!items?.length) return '<p class="muted">Ingen treff.</p>'; return items.map(x=>`<div class="row"><div class="label">${esc(x.kind||x.type||'')}</div><div>${esc(x.name||'')}</div></div>`).join(''); }
function chooseBest(nom, ssrPlaces, ssrAddr, osm){
  const a=nom?.address||{};
  const localKeys=['neighbourhood','quarter','suburb','locality','farm','village','hamlet','town','city_district'];
  for(const k of localKeys){ if(a[k]) return {name:a[k], source:'Nominatim / OSM-adresse', kind:k}; }
  if(nom?.name && !badNames.some(r=>r.test(nom.name))) return {name:nom.name, source:'Nominatim', kind:nom.type||''};
  if(ssrPlaces?.length) return {name:ssrPlaces[0].name, source:'Kartverket/SSR', kind:ssrPlaces[0].kind||''};
  if(osm?.length) return {name:osm[0].name, source:'OpenStreetMap-flate', kind:osm[0].kind||''};
  if(a.road) return {name:a.road, source:'Nominatim / adresse', kind:'road'};
  if(ssrAddr?.length) return {name:ssrAddr[0].name, source:'Kartverket/SSR adresse', kind:ssrAddr[0].kind||''};
  return null;
}
async function nominatim(lat, lon){
  const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&addressdetails=1&namedetails=1&extratags=1&zoom=16&accept-language=nb,no,en`;
  const r=await timeoutFetch(url,7000); if(!r.ok) throw new Error('Nominatim: '+r.status); return r.json();
}
async function ssr(lat, lon){
  const radius = el('ssrRadius') ? el('ssrRadius').value : 500;
  // Kartverket punkt accepts WGS84 with koordsys=4326 in this app. Radius can be adjusted in the UI.
  const url=`https://ws.geonorge.no/stedsnavn/v1/punkt?nord=${lat}&ost=${lon}&koordsys=4326&radius=${radius}&treffPerSide=50&side=1`;
  const r=await timeoutFetch(url,7000); if(!r.ok) throw new Error('Kartverket/SSR: '+r.status); const j=await r.json();
  const names=(j.navn||j.stedsnavn||j.features||[]).map(o=>{
    const p=o.properties||o; const name=(p.stedsnavn||p.skrivemåte||p.navn||p.name||'');
    const kind=(p.navneobjekttype||p.objekttype||p.stedstatus||p.type||''); const dist=p.avstand||p.meterFraPunkt||p.distance||'';
    return {name, kind: kind+(dist?` ${Math.round(dist)} m`:''), rawKind: kind, dist};
  }).filter(x=>x.name);
  const places=names.filter(x=>!addressTypes.includes(x.rawKind)).filter(x=>!/^Adressenavn/i.test(x.rawKind));
  const addr=names.filter(x=>addressTypes.includes(x.rawKind)||/^Adressenavn/i.test(x.rawKind));
  return {places, addr, all:names};
}
async function overpass(lat, lon){
  const q=`[out:json][timeout:6];is_in(${lat},${lon})->.a;area.a["name"];out tags qt 30;`;
  const r=await timeoutFetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),8000); if(!r.ok) throw new Error('OSM/Overpass: '+r.status); const j=await r.json();
  return (j.elements||[]).map(e=>({name:e.tags?.name||'',kind:[e.tags?.place,e.tags?.boundary?`admin ${e.tags.admin_level||''}`:'',e.tags?.landuse,e.tags?.natural,e.tags?.leisure].filter(Boolean).join(' / ')||'område'}))
    .filter(x=>x.name && !badNames.some(r=>r.test(x.name)) && !/^region$/i.test(x.kind))
    .filter(x=>/neighbourhood|quarter|suburb|hamlet|village|town|residential|park|wood|water|locality/i.test(x.kind))
    .slice(0,10);
}
async function lookup(lat, lon, acc=''){
  result.innerHTML=''; const warnings=[]; let nom=null, ssrRes={places:[],addr:[],all:[]}, osm=[];
  setStatus('Slår opp Nominatim …'); try{nom=await nominatim(lat,lon);}catch(e){warnings.push(e.message||String(e));}
  setStatus('Slår opp Kartverket/SSR …'); try{ssrRes=await ssr(lat,lon);}catch(e){warnings.push(e.message||String(e));}
  if(el('overpassChk').checked){ setStatus('Slår opp OSM-flater/Overpass …'); try{osm=await overpass(lat,lon);}catch(e){warnings.push((e.name==='AbortError')?'OSM/Overpass: tidsavbrudd':(e.message||String(e)));} }
  setStatus('Oppslag ferdig.'); const best=chooseBest(nom, ssrRes.places, ssrRes.addr, osm);
  let html='';
  if(best) html+=card('Beste forslag',`<div class="big">${esc(best.name)}</div><div class="muted">${esc(best.source)} · ${esc(best.kind)}</div>`,'best');
  html+=card('Posisjon',`<div class="row"><div class="label">Lat/lon</div><div>${lat.toFixed(6)}, ${lon.toFixed(6)}</div></div><div class="row"><div class="label">Nøyaktighet</div><div>${acc?esc(acc)+' m':'testpunkt'}</div></div>`);
  if(nom){ const a=nom.address||{}; const bits=['neighbourhood','quarter','suburb','locality','farm','village','hamlet','road','city','municipality','county'].filter(k=>a[k]).map(k=>`<span class="pill">${esc(k)}: ${esc(a[k])}</span>`).join(''); html+=card('Nominatim', bits||`<p>${esc(nom.display_name||'')}</p>`); }
  html+=card('Kartverket/SSR status', `<p class="muted">Fant ${ssrRes.all.length} SSR-treff innen ${esc(el('ssrRadius')?.value || '500')} m: ${ssrRes.places.length} stedsnavn og ${ssrRes.addr.length} adressenavn.</p>`);
  html+=card('Kartverket/SSR stedsnavn', rows(ssrRes.places.slice(0,12)));
  html+=card('Kartverket/SSR adresser', rows(ssrRes.addr.slice(0,12)));
  if(!ssrRes.places.length && ssrRes.all.length) html+=card('Kartverket/SSR alle treff', rows(ssrRes.all.slice(0,15)));
  if(el('overpassChk').checked) html+=card('OSM-flater etter filtrering', rows(osm));
  if(warnings.length) html+=card('Feil/varsler', warnings.map(w=>`<p>${esc(w)}</p>`).join(''),'warn');
  result.innerHTML=html;
}
el('locBtn').onclick=()=>{
  if(!navigator.geolocation){setStatus('GPS/geolocation støttes ikke.');return;}
  setStatus('Henter GPS-posisjon …');
  navigator.geolocation.getCurrentPosition(p=>lookup(p.coords.latitude,p.coords.longitude,Math.round(p.coords.accuracy)),err=>setStatus('GPS-feil: '+err.message),{enableHighAccuracy:true,timeout:12000,maximumAge:15000});
};
el('testBtn').onclick=()=>lookup(59.9264,10.7229,'test');
</script>
</body>
</html>
